services:
  postgres:
    image: postgres:18-alpine
    container_name: ndobaak-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ndobaak_dev
      POSTGRES_USER: ndobaak
      POSTGRES_PASSWORD: ndobaak_dev_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndobaak -d ndobaak_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  mailtrap:
    image: dbck/mailtrap:latest
    container_name: ndobaak-mail
    ports:
      - "1025:25"
      - "1080:80"
      - "1587:587"
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  minio:
    image: minio/minio:latest
    container_name: ndobaak-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ndobaak
      MINIO_ROOT_PASSWORD: ndobaak_minio_2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - default

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: ndobaak_network
