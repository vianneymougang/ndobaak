spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ndobaak_dev
    username: ndobaak
    password: ndobaak_dev_2026
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-placeholder}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

app:
  jwt:
    secret: ${JWT_SECRET:ndobaak-dev-secret-key-change-in-production-2026}
    expiration-ms: 86400000 # 24h
    refresh-expiration-ms: 604800000 # 7 jours

  storage:
    endpoint: http://localhost:9000
    access-key: ndobaak
    secret-key: ndobaak_minio_2026
    bucket: ndobaak-media
    region: eu-central-1

  cors:
    allowed-origins: http://localhost:4200

  frontend-url: http://localhost:4200

logging:
  level:
    cm.ndobaak: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
