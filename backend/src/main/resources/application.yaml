spring:
  application:
    name: ndobaak

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  enabled: ${TWILIO_ENABLED:false}

app:
  subscription:
    amount: ${SUBSCRIPTION_AMOUNT:100000}
  payment:
    commission-rate: 0.07
    installment-threshold: 500000
    primary-gateway: ${PAYMENT_GATEWAY:mock}
    frontend-callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:4200/payments/callback}
    notchpay:
      base-url: ${NOTCHPAY_BASE_URL:https://api.notchpay.co}
      public-key: ${NOTCHPAY_PUBLIC_KEY:}
      webhook-hash: ${NOTCHPAY_WEBHOOK_HASH:}
      callback-url: ${NOTCHPAY_CALLBACK_URL:http://localhost:4200/payments/callback}
      private-key: ${NOTCHPAY_PRIVATE_KEY:}
