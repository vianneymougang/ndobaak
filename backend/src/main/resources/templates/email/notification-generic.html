<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title th:text="${notificationTitle}">Notification — Ndobaâk</title>
</head>
<body style="margin:0;padding:0;background-color:#F0EDEA;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F0EDEA;padding:48px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr><td style="height:3px;background:#1B4332;border-radius:3px 3px 0 0;"></td></tr>
        <tr><td style="background:#ffffff;border-radius:0 0 12px 12px;box-shadow:0 4px 24px rgba(27,67,50,0.08);padding:40px 48px;">
          <p style="margin:0 0 32px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:20px;font-weight:700;color:#1B4332;">Ndoba&#226;k</p>
          <h1 style="margin:0 0 20px;font-size:24px;font-weight:700;color:#1B4332;line-height:1.3;" th:text="${notificationTitle}">Titre notification</h1>
          <th:block th:if="${firstName != null}">
            <p style="margin:0 0 8px;font-size:15px;color:#374151;">Bonjour <strong th:text="${firstName}">Prénom</strong>,</p>
          </th:block>
          <p style="margin:0 0 32px;font-size:15px;color:#374151;line-height:1.7;" th:text="${notificationMessage}">Message de notification.</p>
          <hr style="border:none;border-top:1px solid #E5E0D8;margin:32px 0 20px;">
          <p style="margin:0;font-size:11px;color:#9CA3AF;text-align:center;">&#169; 2026 Ndoba&#226;k &mdash; Activit&#233;s encadr&#233;es par TANK'IMMO SAS</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
