services:
  # --- Base de données PostgreSQL ---
  postgres:
    image: postgres:18-alpine
    container_name: ndobaak-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ndobaak_dev
      POSTGRES_USER: ndobaak
      POSTGRES_PASSWORD: ndobaak_dev_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndobaak -d ndobaak_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # --- pgAdmin (interface web pour PostgreSQL) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ndobaak-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ndobaak.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  mailpit:
    image: axllent/mailpit:latest
    container_name: ndobaak-mail
    ports:
      - "1080:8025"
      - "1025:1025"
    networks:
      - default
    restart: unless-stopped

  # --- MinIO (alternative locale à S3 pour les fichiers/photos) ---
  minio:
    image: minio/minio:latest
    container_name: ndobaak-storage
    restart: unless-stopped
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    environment:
      MINIO_ROOT_USER: ndobaak
      MINIO_ROOT_PASSWORD: ndobaak_minio_2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - default

  # --- Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndobaak-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ndobaak_dev
      SPRING_DATASOURCE_USERNAME: ndobaak
      SPRING_DATASOURCE_PASSWORD: ndobaak_dev_2026
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev-placeholder}
      JWT_SECRET: ${JWT_SECRET:-ndobaak-dev-secret-key-change-in-production-2026}
      APP_STORAGE_ENDPOINT: http://minio:9000
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY:-}
      NOTCHPAY_WEBHOOK_HASH: ${NOTCHPAY_WEBHOOK_HASH:-}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - default

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: ndobaak_network
