<div class="dashboard-page">
  <div class="page-header fade-slide-up">
    <h1 class="page-title">Centre de commande</h1>
    <p class="page-subtitle">Vue d'ensemble de la plateforme Ndobaâk</p>
  </div>

  <section class="section section--health" aria-label="Santé plateforme">
    <app-platform-health
      [score]="healthScore()"
      [status]="healthStatus()"
      [pendingCount]="pendingListings().length"
      [anomalyCount]="anomalies().length"
      [failedCount]="failedTransactionCount()"
      [loading]="loadingStats() || loadingListings() || loadingAnomalies()"
      [error]="errorStats() && errorListings() && errorAnomalies()"
      (retry)="loadStats(); loadListings(); loadAnomalies()"
    />
  </section>

  <section class="section section--metrics" aria-label="Métriques clés">
    <app-command-metrics
      [stats]="stats()"
      [userDelta]="userDelta()"
      [bookingDelta]="bookingDelta()"
      [revenueDelta]="revenueDelta()"
      [loading]="loadingStats()"
      [error]="errorStats()"
      (retry)="loadStats()"
    />
  </section>

  <section class="section section--attention" aria-label="Nécessite votre attention">
    <app-attention-panel
      [pendingListings]="urgentListings()"
      [pendingReviews]="pendingReviews()"
      [anomalies]="anomalies()"
      [loadingListings]="loadingListings()"
      [loadingReviews]="loadingReviews()"
      [loadingAnomalies]="loadingAnomalies()"
      [errorListings]="errorListings()"
      [errorReviews]="errorReviews()"
      [errorAnomalies]="errorAnomalies()"
      [actionLoading]="actionLoading()"
      (validateListing)="onValidateListing($event)"
      (rejectListing)="onRejectListing($event)"
      (approveReview)="onApproveReview($event)"
      (rejectReview)="onRejectReview($event)"
      (retryListings)="loadListings()"
      (retryReviews)="loadReviews()"
      (retryAnomalies)="loadAnomalies()"
    />
  </section>

  <div class="grid-2col">
    <section class="section section--charts" aria-label="Graphiques">
      <app-admin-charts
        [stats]="stats()"
        [loading]="loadingStats()"
        [error]="errorStats()"
        (retry)="loadStats()"
      />
    </section>

    <section class="section section--insights" aria-label="Insights">
      <app-admin-insights
        [insights]="insights()"
        [loading]="loadingStats() || loadingListings() || loadingAnomalies()"
        [error]="errorStats()"
        (retry)="loadStats()"
      />
    </section>
  </div>

  <section class="section section--transactions" aria-label="Transactions récentes">
    <app-transaction-feed
      [transactions]="recentTransactions()"
      [loading]="loadingTransactions()"
      [error]="errorTransactions()"
      (retry)="loadTransactions()"
    />
  </section>
</div>
