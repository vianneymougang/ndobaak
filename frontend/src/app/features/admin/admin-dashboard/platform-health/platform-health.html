@if (loading()) {
  <div class="health-strip health-strip--skeleton">
    <div class="health-gauge-skeleton">
      <p-skeleton width="5.5rem" height="5.5rem" borderRadius="50%" />
    </div>
    <div class="health-details-skeleton">
      <p-skeleton width="60%" height="1rem" />
      <p-skeleton width="40%" height="0.75rem" />
      <div class="health-indicators-skeleton">
        <p-skeleton width="6rem" height="2.5rem" borderRadius="12px" />
        <p-skeleton width="6rem" height="2.5rem" borderRadius="12px" />
        <p-skeleton width="6rem" height="2.5rem" borderRadius="12px" />
      </div>
    </div>
  </div>
} @else if (error()) {
  <div class="health-strip health-strip--error">
    <i class="pi pi-exclamation-triangle error-icon" aria-hidden="true"></i>
    <div class="error-content">
      <p class="error-text">Impossible de charger l'état de la plateforme.</p>
      <p-button
        label="Réessayer"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        size="small"
        (click)="retry.emit()"
      />
    </div>
  </div>
} @else {
  <div
    class="health-strip fade-slide-up"
    [class.health-strip--good]="status() === 'good'"
    [class.health-strip--warning]="status() === 'warning'"
    [class.health-strip--critical]="status() === 'critical'"
  >
    <div class="health-gauge" role="img" [attr.aria-label]="'Score santé plateforme: ' + score() + ' sur 100'">
      <svg viewBox="0 0 96 96" class="gauge-svg">
        <circle
          cx="48"
          cy="48"
          r="42"
          fill="none"
          stroke-width="5"
          class="gauge-bg"
        />
        <circle
          cx="48"
          cy="48"
          r="42"
          fill="none"
          stroke-width="5"
          class="gauge-fill gauge-fill--animated"
          stroke-linecap="round"
          [style.stroke-dasharray]="circumference"
          [style.--gauge-target]="strokeDashoffset()"
          [style.--gauge-circumference]="circumference"
          transform="rotate(-90 48 48)"
        />
      </svg>
      <span class="gauge-score">{{ score() }}</span>
    </div>

    <div class="health-info">
      <div class="health-status">
        <i [class]="statusIcon()" aria-hidden="true"></i>
        <span class="status-label">{{ statusLabel() }}</span>
      </div>
      <p class="health-description">Santé plateforme</p>
    </div>

    <div class="health-indicators">
      <div class="indicator" [class.indicator--active]="pendingCount() > 0">
        <span class="indicator-value">{{ pendingCount() }}</span>
        <span class="indicator-label">En attente</span>
      </div>
      <div class="indicator indicator--anomaly" [class.indicator--active]="anomalyCount() > 0">
        <span class="indicator-value">{{ anomalyCount() }}</span>
        <span class="indicator-label">Anomalies</span>
      </div>
      <div class="indicator indicator--failed" [class.indicator--active]="failedCount() > 0">
        <span class="indicator-value">{{ failedCount() }}</span>
        <span class="indicator-label">Échouées</span>
      </div>
    </div>
  </div>
}
