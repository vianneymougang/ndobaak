<div class="admin-shell" [class.sidebar-collapsed]="!sidebarOpen()">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <span class="brand-logo">N</span>
      @if (sidebarOpen()) {
        <span class="brand-name">Ndobaak Admin</span>
      }
    </div>

    <nav class="sidebar-nav">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" class="nav-item" [title]="link.label">
          <i [class]="link.icon"></i>
          @if (sidebarOpen()) { <span>{{ link.label }}</span> }
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="nav-item" title="Retour au site">
        <i class="pi pi-arrow-left"></i>
        @if (sidebarOpen()) { <span>Retour au site</span> }
      </a>
      <button class="nav-item logout-btn" (click)="logout()" title="Déconnexion">
        <i class="pi pi-sign-out"></i>
        @if (sidebarOpen()) { <span>Déconnexion</span> }
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Ouvrir/fermer le menu">
        <i class="pi pi-bars"></i>
      </button>
      <div class="header-right">
        <p-avatar [label]="userInitials()" shape="circle" styleClass="admin-avatar" />
        <span class="admin-name">{{ user()?.firstName }} {{ user()?.lastName }}</span>
      </div>
    </header>
    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
</div>

<p-toast position="top-right" />
