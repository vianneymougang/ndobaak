<div class="failure-page">
  <div
    class="failure-card"
    ngmMotion
    [initial]="{ opacity: 0, scale: 0.95 }"
    [animate]="{ opacity: 1, scale: 1 }"
    [transition]="{ type: 'spring', stiffness: 300, damping: 25 }"
  >
    <div
      class="failure-icon"
      [class.failure-icon--canceled]="reason === 'CANCELED'"
      [class.failure-icon--expired]="reason === 'EXPIRED'"
      ngmMotion
      [initial]="{ scale: 0 }"
      [animate]="{ scale: 1 }"
      [transition]="{ type: 'spring', stiffness: 400, damping: 15, delay: 0.2 }"
    >
      @if (reason === 'CANCELED') {
        <i class="pi pi-ban" aria-hidden="true"></i>
      } @else if (reason === 'EXPIRED') {
        <i class="pi pi-clock" aria-hidden="true"></i>
      } @else {
        <i class="pi pi-times" aria-hidden="true"></i>
      }
    </div>

    <h1 class="failure-title">{{ content().title }}</h1>
    <p class="failure-desc">{{ content().desc }}</p>

    <div class="failure-tips">
      <ul class="tips-list">
        @for (tip of content().tips; track $index) {
          <li>
            <i class="pi pi-check-circle" aria-hidden="true"></i>
            {{ tip }}
          </li>
        }
      </ul>
    </div>

    <div
      class="failure-actions"
      ngmMotion
      [initial]="{ opacity: 0, y: 10 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ delay: 0.4, duration: 0.3 }"
    >
      @if (reason !== 'CANCELED') {
        <p-button
          label="Réessayer le paiement"
          icon="pi pi-refresh"
          [routerLink]="retryLink()"
        />
      }
      <p-button
        label="Mes réservations"
        [icon]="reason === 'CANCELED' ? 'pi pi-arrow-right' : 'pi pi-arrow-left'"
        severity="secondary"
        [outlined]="true"
        routerLink="/my-bookings"
      />
    </div>
  </div>
</div>
