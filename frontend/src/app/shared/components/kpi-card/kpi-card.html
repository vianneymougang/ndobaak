@if (loading()) {
  <div class="kpi-card kpi-card--skeleton">
    <p-skeleton width="2.5rem" height="2.5rem" borderRadius="12px" />
    <p-skeleton width="60%" height="0.75rem" styleClass="mt-3" />
    <p-skeleton width="45%" height="1.75rem" styleClass="mt-1" />
    <p-skeleton width="35%" height="0.75rem" styleClass="mt-1" />
  </div>
} @else {
  <a
    class="kpi-card"
    [class.kpi-card--accent]="accent()"
    [routerLink]="routerLink()"
    [attr.role]="routerLink() ? null : 'button'"
    [attr.tabindex]="routerLink() ? null : '0'"
    ngmMotion
    [initial]="{ opacity: 0, y: 15 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ duration: 0.3, delay: animationDelay(), ease: 'easeOut' }"
    [whileHover]="{ y: -3 }"
  >
    <div class="kpi-icon-wrap" [class.kpi-icon-wrap--accent]="accent()">
      <i class="pi {{ icon() }}" aria-hidden="true"></i>
    </div>
    <span class="kpi-label">{{ label() }}</span>
    <span class="kpi-value">{{ value() }}</span>
    @if (trend() !== null && trend() !== 0) {
      <span
        class="kpi-trend"
        [class.kpi-trend--up]="trendPositive()"
        [class.kpi-trend--down]="trendNegative()"
        ngmMotion
        [initial]="{ scale: 0 }"
        [animate]="{ scale: 1 }"
        [transition]="{ type: 'spring', stiffness: 400, damping: 15, delay: animationDelay() + 0.2 }"
      >
        <i
          class="pi"
          [class.pi-arrow-up-right]="trendPositive()"
          [class.pi-arrow-down-right]="trendNegative()"
          aria-hidden="true"
        ></i>
        {{ formattedTrend() }}
      </span>
    }
  </a>
}
